version: '3.9'

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: streetsetu
      POSTGRES_USER: streetsetu
      POSTGRES_PASSWORD: streetsetu
    ports:
      - '5432:5432'

  redis:
    image: redis:7
    ports:
      - '6379:6379'

  minio:
    image: minio/minio
    command: server /data --console-address ':9001'
    environment:
      MINIO_ROOT_USER: streetsetu
      MINIO_ROOT_PASSWORD: streetsetu123
    ports:
      - '9000:9000'
      - '9001:9001'
